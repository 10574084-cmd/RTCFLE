name: Build custom Ruffle and deploy RTCFLE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ruffle-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout RTCFLE
        uses: actions/checkout@v6

      - name: Checkout pinned Ruffle source
        uses: actions/checkout@v6
        with:
          repository: ruffle-rs/ruffle
          ref: 9c6ab49454c96222a2d55db2c361cbf3faa44785
          path: ruffle-source

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ruffle-source/web/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Rust and WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install matching wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked

      - name: Apply RTCFLE live-mutation patch
        run: node scripts/patch-ruffle.mjs ruffle-source

      - name: Install Ruffle web dependencies
        working-directory: ruffle-source/web
        run: npm ci

      - name: Build custom Ruffle WebAssembly player
        working-directory: ruffle-source/web
        run: npm run build

      - name: Bundle custom Ruffle with RTCFLE
        run: |
          test -f ruffle-source/web/packages/selfhosted/dist/ruffle.js
          mkdir -p ruffle
          cp -R ruffle-source/web/packages/selfhosted/dist/. ruffle/
          test -f ruffle/ruffle.js
          rm -rf ruffle-source

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
